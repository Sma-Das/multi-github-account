[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "github-account-router"
version = "0.3.0"
description = "Repository-scoped GitHub authentication for concurrent agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Sma-Das"}]
dependencies = []

[project.scripts]
ghr = "ghr.cli:main"

[tool.setuptools]
packages = ["ghr"]

[tool.setuptools.package-data]
ghr = ["web/*"]
